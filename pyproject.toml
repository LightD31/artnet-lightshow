# The Python half of the lightshow: the audio analysis in src/analysis and the
# live input in src/live_input.py. Not a package to install — a locked
# environment to run them in:
#
#     uv sync --extra cpu        any machine, no GPU
#     uv sync --extra cu128      an NVIDIA card (CUDA 12.8)
#     uv sync --extra rocm       an AMD card on Linux (ROCm 7.2)
#
# Exactly one of the three. torch, torchaudio and torchvision have to come from
# the same build — a torchvision built for another torch installs cleanly and
# then fails every model with "operator torchvision::nms does not exist" —
# which is what the per-extra indexes below guarantee and a plain
# `pip install -r requirements.txt` cannot. The server picks up the .venv this
# creates by itself (src/python-env.ts).
#
# AMD iGPUs on Windows (Radeon 780M/890M) are not covered: their torch comes
# from AMD's own index with a per-GPU extra. See requirements.txt for that
# install, which remains the route for anything uv does not fit.

[project]
name = "artnet-lightshow-analysis"
version = "1.0.0"
description = "Audio analysis and live input for the Art-Net lightshow."
requires-python = ">=3.10,<3.14"
dependencies = [
    # Core analysis.
    "librosa>=0.10",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "soundfile>=0.12",
    "threadpoolctl>=3.1",
    "audioread>=3.0",
    # Models. torch itself is in the extras below, one per build.
    "huggingface_hub>=0.23",
    "beat_this>=1.1",
    "demucs>=4.0",
    "muq>=0.1",
    # MuQ calls the Conformer encoder directly and needs its v4 hidden states.
    "transformers==4.51.3",
    "safetensors>=0.4",
    # SongFormer's code, which ships with its weights (src/analysis/songformer.py).
    "einops>=0.7",
    "x-transformers>=1.0",
    "ema-pytorch>=0.2",
    "loguru>=0.7",
    "omegaconf>=2.3",
    # The slower separator. Its CPU extra is only onnxruntime; PyTorch still
    # runs it on the GPU.
    "audio-separator[cpu]>=0.30",
    "onnxruntime>=1.17",
    # The AudioSet tagger (weights: scripts/download-models.py --only panns).
    "panns_inference>=0.1.1",
    # Live input.
    "soundcard>=0.4.6",
    "sounddevice>=0.5",
    # Audio download fallback.
    "yt-dlp[default]>=2025.11.12",
]

[project.optional-dependencies]
cpu = ["torch>=2.6", "torchaudio>=2.6", "torchvision>=0.21"]
cu128 = ["torch>=2.7", "torchaudio>=2.7", "torchvision>=0.22"]
rocm = ["torch>=2.7", "torchaudio>=2.7", "torchvision>=0.22", "triton-rocm; sys_platform == 'linux'"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
# ROCm's torch needs its own build of Triton, published only beside it.
triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
