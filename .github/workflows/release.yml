name: Release

# A version tag (v1.2.3, matching package.json) builds the packages — the
# Windows installer and portable zip, the Linux archive — checks each as CI
# does (package.yml), and puts them on a draft GitHub release to be read over
# and published by hand.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but package.json says $version"
            exit 1
          fi

  package:
    needs: version
    uses: ./.github/workflows/package.yml

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "ArtNet Lightshow ${GITHUB_REF_NAME#v}" --generate-notes
