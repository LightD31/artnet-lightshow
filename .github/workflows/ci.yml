name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The client bundle is generated, not committed — make sure it still builds.
      - name: Build client
        run: npm run build:client

  # The analysis pipeline is Python, and its correctness is not something the
  # Node tests can reach: a beat grid 40 ms out produces a perfectly valid
  # timeline full of cues that land late. So CI installs the scientific stack
  # and runs the real thing against synthetic tracks whose tempo, metre and
  # arrangement are known by construction.
  #
  # torch is installed here, CPU-only. It used to be skipped as a 2 GB wheel
  # bought for an optional tagger — but the beat grid, the metre and the
  # instrument roles all come from models now, and a CI run that skips them
  # tests a pipeline nobody ships. The CPU index keeps the download to a few
  # hundred megabytes; model weights are cached between runs, because a suite
  # that re-downloads 400 MB of checkpoints every push is a suite people learn
  # to ignore.
  #
  # panns_inference stays out: it really is optional, every consumer treats a
  # missing answer as "unknown", and the bootstrap-ordering tests already cover
  # the path.
  python:
    runs-on: ubuntu-latest
    env:
      # No GPU on a runner, and saying so skips the CUDA probe.
      ARTNET_ANALYSIS_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # torch and torchaudio have to come from the same index. Installing torch
      # from the CPU index and letting a later `pip install demucs` pull
      # torchaudio from PyPI gets a torchaudio built against a different torch,
      # and its native extension then fails to load — which surfaces as every
      # model-backed test erroring out, not as an install failure.
      - name: Install torch and torchaudio (CPU build)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip freeze | grep -E '^(torch|torchaudio)==' > /tmp/torch-constraints.txt
          cat /tmp/torch-constraints.txt

      # Constrained to the pair just installed, so resolving beat_this and
      # demucs cannot quietly swap either of them back to a PyPI build. If some
      # dependency genuinely needs a different version, this fails here with
      # the conflict named rather than at import time.
      - name: Install the analysis dependencies
        run: pip install -c /tmp/torch-constraints.txt
             numpy scipy scikit-learn soundfile librosa threadpoolctl
             beat_this demucs

      # Fail fast and legibly. The native extension only loads when the pair
      # matches, and finding that out from eighteen test errors wastes a cycle.
      - name: Verify the model stack imports
        run: |
          python -c "import torch, torchaudio; print('torch', torch.__version__, '| torchaudio', torchaudio.__version__)"

      # Keyed on the model code rather than on the lockfile: the checkpoints
      # change when models.py names a different one, not when a dependency
      # bumps a patch version. Two directories, because the two models do not
      # agree on where weights live — Beat This! uses the torch hub cache and
      # Demucs pulls from the Hugging Face hub.
      - name: Cache model checkpoints
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: model-checkpoints-${{ hashFiles('src/analysis/models.py') }}
          restore-keys: model-checkpoints-

      # warm_up() swallows its own failures by design — a model that will not
      # load must not stop a server from starting — so it cannot be the thing
      # that proves the models work. Load the tracker directly and let the
      # exception out.
      - name: Fetch model weights
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from analysis import models
          print('beat tracker:', type(models.beat_tracker()).__name__)
          print('separator:', type(models.separator()).__name__)
          "

      - name: Compile every module
        run: python -m compileall -q src scripts tests

      - name: Analysis tests
        run: python -m unittest discover -s tests/python -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Runtime dependencies only: a dev-only advisory should not fail a show tool's CI.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
