name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The client bundle is generated, not committed — make sure it still builds.
      - name: Build client
        run: npm run build:client

  # The analyzer is ~1,800 lines of Python that CI never touched. It does not
  # run here (librosa + torch is a heavy install for a syntax-and-wiring check),
  # but a compile pass and the bootstrap-ordering tests are cheap and catch the
  # class of bug that only shows up on an operator's machine.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile every module
        run: python -m compileall -q src scripts tests

      - name: Bootstrap ordering tests
        run: python -m unittest discover -s tests/python -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Runtime dependencies only: a dev-only advisory should not fail a show tool's CI.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
