name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The client bundle is generated, not committed — make sure it still builds.
      - name: Build client
        run: npm run build:client

  # The analysis pipeline is Python, and its correctness is not something the
  # Node tests can reach: a beat grid 40 ms out produces a perfectly valid
  # timeline full of cues that land late. So CI installs the scientific stack
  # and runs the real thing against synthetic tracks whose tempo, metre and
  # arrangement are known by construction.
  #
  # torch and panns_inference are deliberately not installed: the tagger is
  # optional by design, every consumer treats a missing answer as "unknown",
  # and a 2 GB wheel is a poor trade for exercising a code path that is already
  # covered by the bootstrap-ordering tests.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install the analysis dependencies
        run: pip install numpy scipy scikit-learn soundfile librosa threadpoolctl

      - name: Compile every module
        run: python -m compileall -q src scripts tests

      - name: Analysis tests
        run: python -m unittest discover -s tests/python -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Runtime dependencies only: a dev-only advisory should not fail a show tool's CI.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
