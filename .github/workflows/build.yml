name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build exe
        run: npm run build

      - name: Assemble bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle

          # Main executable
          Copy-Item dist\artnet-lightshow.exe bundle\

          # Ableton Link Python bridge + requirements
          Copy-Item src\link-bridge.py bundle\
          Copy-Item requirements.txt bundle\

          # README
          Copy-Item README.md bundle\

          # Write a quick-start launcher batch file
          @"
          @echo off
          start "" artnet-lightshow.exe
          "@ | Out-File -Encoding ascii bundle\start.bat

      - name: Create zip
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-${{ github.sha }}".Substring(0,10) }
          Compress-Archive -Path bundle\* -DestinationPath "artnet-lightshow-$version-win-x64.zip"
          echo "ZIP_NAME=artnet-lightshow-$version-win-x64.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artnet-lightshow-win-x64
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
